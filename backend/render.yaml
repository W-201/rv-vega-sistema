services:
  - type: web
    name: rv-vega-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rv-vega-db
          property: connectionString

databases:
  - name: rv-vega-db
    databaseName: rv_vega_db
    user: rv_vega_user
    plan: free
    postgresMajorVersion: 16
